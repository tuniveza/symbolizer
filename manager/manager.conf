# manager settings (bash). Paths may be absolute or relative to ~/an.

# where your projects live — `manager scan/adopt/check/clean` look here
ROOTS=(co pj ca "$HOME/Projects")

# never offer anything under these as a new project (third-party SDKs, engines, IDEs,
# vendored deps). Existing make.sh files inside them still count as projects.
IGNORE=(
  bi st no mu em ed ar ca/sy/manager
  co/ar/ps1/nugget co/ar/snes/wla-dx co/ar/n64
  co/v co/gu co/mo/an
  co/rb/2d/fs/samples co/rb/2d/fs/docs
  co/c/3D/pj/bsg/The-Ruins-of-Bezan/deps
  co/c/2D/nfs/vendored
  pj/ns/fixer-jobs pj/ns/backups pj/ns/archive
  "*backup*" "*/old" "*/archive"
)

# components `manager setup` installs by default (`manager setup all` adds the optional ones: retro rust)
SETUP_DEFAULT=(shell system watchexec c py js hx java love odin crystal godot gleam v dragonruby)
